<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Numbers Table</title>
    <link rel="stylesheet" href="style3.css">
</head>
<body>

<table class="color-table">
    <tr>
        <th class="numbers">Numbers</th>
        <th class="singular">Singular</th>
        <th class="plural">Plural</th>
    </tr>
    <tr>
        <td class="one">One</td>
        <td class="boy">Boy</td>
        <td class="boys">Boys</td>
    </tr>
    <tr>
        <td class="two">Two</td>
        <td class="man">Man</td>
    </tr>
    <tr>
        <td class="three">Three</td>
        <td class="table">Table</td>
        <td class="tables">Tables</td>
    </tr>
    <tr>
        <td class="four">Four</td>
        <td class="animal">Animal</td>
        <td class="animals">Animals</td>
    </tr>
</table>

</body>
</html>
