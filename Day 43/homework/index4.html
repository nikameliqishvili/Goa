<!--
HTML-ში არსებობს 3 სახის სია:

1) დალაგებული სია (Ordered List) -> <ol>
ახასიათებს:
- ელემენტები დალაგებულია თანმიმდევრობით
- ავტომატურად ენიჭება ნომრები (1, 2, 3…) ან ასოები (A, B, C…)
- გამოიყენება მაშინ, როცა რიგითობას აქვს მნიშვნელობა

მაგალითად:
<ol>
  <li>პირველი</li>
  <li>მეორე</li>
</ol>

2) დაულაგებელი სია (Unordered List) -> <ul>
ახასიათებს:
- ელემენტებს არ აქვთ რიგითი ნომრები
- ნაგულისხმევად აქვს წერტილები (•)
- გამოიყენება, როცა რიგითობას მნიშვნელობა არ აქვს

მაგალითად:
<ul>
  <li>ვაშლი</li>
  <li>მსხალი</li>
</ul>

3) აღწერითი სია (Description List) -> <dl>
ახასიათებს:
- გამოიყენება ტერმინებისა და მათი აღწერისთვის
- შედგება <dt> (ტერმინი) და <dd> (აღწერა) ელემენტებისგან
- არ აქვს წერტილები ან ნომრები

მაგალითად:
<dl>
  <dt>HTML</dt>
  <dd>ვებ გვერდების სტრუქტურის ენა</dd>
</dl>
-->
<!DOCTYPE html>
<html lang="ka">
<head>
    <meta charset="UTF-8">
    <title>Unordered Lists</title>
    <link rel="stylesheet" href="style4.css">
</head>
<body>

    <h3> Default bullets</h3>
    <ul class="list-default">
        <li>ელემენტი 1</li>
        <li>ელემენტი 2</li>
        <li>ელემენტი 3</li>
    </ul>

    <h3> ცარიელი bullets</h3>
    <ul class="list-empty">
        <li>ელემენტი 1</li>
        <li>ელემენტი 2</li>
        <li>ელემენტი 3</li>
    </ul>

    <h3> bullets გარეშე</h3>
    <ul class="list-none">
        <li>ელემენტი 1</li>
        <li>ელემენტი 2</li>
        <li>ელემენტი 3</li>
    </ul>

    <h3> ოთხკუთხედი bullets</h3>
    <ul class="list-square">
        <li>ელემენტი 1</li>
        <li>ელემენტი 2</li>
        <li>ელემენტი 3</li>
    </ul>

</body>
</html>
