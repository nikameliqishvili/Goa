<!--
რატომ არ არის კარგი, როცა ol-ს და ul-ს არასწორ list-style-type-ს ვანიჭებთ?

1) <ol>
<ol> ელემენტი სემანტიკურად ნიშნავს დალაგებულ სიას,
ანუ იმ სიას, სადაც აითემების თანმიმდევრობას მნიშვნელობა აქვს


თუ <ol>-ს მივანიჭებთ დაულაგებელი სიის სტილებს
(მაგ: disc, circle, square):
- ვიზუალურად დავკარგავთ ნომრებს
- მომხმარებლისთვის გაუგებარი გახდება თანმიმდევრობა
- სემანტიკა და ვიზუალი ერთმანეთს აღარ ემთხვევა



2) <ul> (დაულაგებელი სია)
<ul> ელემენტი ნიშნავს სიას, სადაც რიგითობას მნიშვნელობა არ აქვს.

თუ <ul>-ს მივანიჭებთ დალაგებული სიის სტილებს
(მაგ: decimal, upper-roman, lower-alpha):
- ვიზუალურად მივიღებთ ნომრებს, მაგრამ HTML ამბობს,
  რომ რიგითობა მნიშვნელობას არ ატარებს
- კოდი გახდება არასწორად გაგებადი
- ირღვევა სემანტიკა და ხელმისაწვდომობა 


შეჯამება:
- <ol> უნდა გამოვიყენოთ დალაგებული სიებისთვის და შესაბამისი სტილებით
- <ul> უნდა გამოვიყენოთ დაულაგებელი სიებისთვის და შესაბამისი სტილებით
