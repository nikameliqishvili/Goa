<!DOCTYPE html>
<html lang="ka">
<head>
<meta charset="UTF-8">
<title>4 ღილაკი</title>
<style>
  body {
    background-color: #f0f0f0;
    display: flex;
    justify-content: space-around;
    align-items: center;
    height: 100vh;
    margin: 0;
    font-family: Arial, sans-serif;
  }

  .button {
    padding: 15px 30px;
    font-size: 18px;
    border: none;
    border-radius: 10px;
    cursor: pointer;
    color: white;
    transition: transform 0.2s, box-shadow 0.2s;
  }

  .button:hover {
    transform: scale(1.1);
    box-shadow: 0 5px 15px rgba(0,0,0,0.3);
  }

  
  #button1 {
    background-color: #e74c3c;
    padding: 15px 40px;
    font-size: 20px;
  }

  #button2 {
    background-color: #3498db;
    padding: 12px 25px;
    font-size: 16px;
  }

  #button3 {
    background-color: #2ecc71; 
    padding: 18px 35px;
    font-size: 22px;
  }

  #button4 {
    background-color: #f1c40f;
    padding: 10px 20px;
    font-size: 14px;
    color: black;
  }
</style>
</head>
<body>

<button class="button" id="button1">ღილაკი 1</button>
<button class="button" id="button2">ღილაკი 2</button>
<button class="button" id="button3">ღილაკი 3</button>
<button class="button" id="button4">ღილაკი 4</button>

</body>
</html>
