
<!DOCTYPE html>
<html lang="ka">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ფერის შეცვლის მაგალითი</title>
    <style>
        
        h1 { background-color: #ff9999; padding: 10px; }
        h2 { background-color: #99ccff; padding: 10px; }
        h3 { background-color: #99ff99; padding: 10px; }

        p:nth-of-type(1) { background-color: #ffeb99; padding: 10px; }
        p:nth-of-type(2) { background-color: #d9b3ff; padding: 10px; }
        p:nth-of-type(3) { background-color: #ffd9cc; padding: 10px; }

        
        .btn1 { background-color: #ff6666; color: white; border: none; padding: 10px 20px; margin: 5px; cursor: pointer; }
        .btn2 { background-color: #6699ff; color: white; border: none; padding: 10px 20px; margin: 5px; cursor: pointer; }
        .btn3 { background-color: #66cc66; color: white; border: none; padding: 10px 20px; margin: 5px; cursor: pointer; }

    </style>
</head>
<body>

    <!-- სათაურები -->
    <h1>ეს არის პირველი სათაური</h1>
    <h2>ეს არის მეორე სათაური</h2>
    <h3>ეს არის მესამე სათაური</h3>

    <!-- პარაგრაფები -->
    <p>ეს არის პირველი პარაგრაფი. მას აქვს საკუთარი უკანა ფონური ფერი.</p>
    <p>ეს არის მეორე პარაგრაფი, განსხვავებული ფერით.</p>
    <p>ეს არის მესამე პარაგრაფი, უნიკალური ფონით.</p>

    <!-- ღილაკები -->
    <button class="btn1">ღილაკი 1</button>
    <button class="btn2">ღილაკი 2</button>
    <button class="btn3">ღილაკი 3</button>

</body>
</html>
