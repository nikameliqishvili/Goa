<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>სარეგისტრაციო ფორმა</title>
</head>
<body>
    <h1>სარეგისტრაციო ფორმა.</h1>
    <form>
        <label for="Frist-name">სახელი</label>
        <input type="text"  name="Frist-name" id="Frist-name" placeholder="Frist-name">
        <br>
        <label for="last-name">გვარი</label>
        <input type="text" name="last-name" id="last-name" placeholder="last-name">
        <br>
        <label for="email">მაილი</label>
        <input type="text" name="email" id="email" placeholder="email">
        <br>
        <label for="password">პაროლი</label>
        <input type="password" name="password"  id="password" placeholder="password"> 
        <br>
        <label for="Gender-MALE">MALE</label>
        <input type="radio" name="Gender" id="Gender-MALE">
        <br>
        <label for="Gender-FEMALE">FEMALE</label>
        <input type="radio" name="Gender" id="Gender-FEMALE">
        <br>
        <label for="age"></label>
        <input type="number"  name="age" id="age">
        <br>
        <label for="Date"></label>
        <input type="date" name="Date" id="Date">
        <br>
        <label for="something1">something 1</label>
        <input type="checkbox" name="something" id="something1">
        <br>
        <label for="something2">something 2</label>
        <input type="checkbox" name="something" id="something2">
        <br>
        <label for="something3">something 3</label>
        <input type="checkbox" name="something" id="something3">
        <br>
        <input type="submit" value="Registrer">
    </form>
</body>
</html>
