<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Schedule Table</title>
</head>
<body>

<table border="1">
    <tr>
        <td rowspan="3"><b>Tuesday</b></td>
        <td>8:00 a.m.</td>
        <td>11:00 a.m.</td>
        <td rowspan="2" align="center"><b>XPath</b></td>
    </tr>
    <tr>
        <td>11:00 a.m.</td>
        <td>2:00 p.m.</td>
    </tr>
    <tr>
        <td>2:00 p.m.</td>
        <td>5:00 p.m.</td>
        <td align="center"><b>XSL Transformations</b></td>
    </tr>
</table>

</body>
</html>
