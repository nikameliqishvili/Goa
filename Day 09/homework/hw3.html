<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>



    <h1>შემოდით ჩვენს საიტზე!</h1>


<main>
    <h2>შეიყვანე ინფორმაცია</h2>
    <p>ეს არის მაგალითი ფორმის, სადაც თქვენ შეგიძლიათ შეიყვანოთ თქვენი ინფორმაცია.</p>
    
    <form>
        <label for="name">სახელი:</label>
        <input type="text" id="name" name="name" required placeholder="შეიყვანეთ თქვენი სახელი">

        <label for="email">ელ. ფოსტა:</label>
        <input type="email" id="email" name="email" required placeholder="შეიყვანეთ თქვენი ელ. ფოსტა">

        <label for="password">პაროლი:</label>
        <input type="password" id="password" name="password" required placeholder="შეიყვანეთ პაროლი">

        <label for="message">შეტყობინება:</label>
        <textarea id="message" name="message" rows="4" placeholder="შეიყვანეთ თქვენი შეტყობინება"></textarea>

        <label for="subscribe">გსურთ გამოწერა სიახლეებისათვის?</label>
        <input type="checkbox" id="subscribe" name="subscribe" value="yes">
        
        <button type="submit">გაგზავნა</button>
    </form>
</main>
</body>
</html>
