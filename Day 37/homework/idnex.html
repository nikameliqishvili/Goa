<!--RGB ნიშნავს Red, Green, Blue (წითელი, მწვანე, ლურჯი)
   ეს არის ფერის მოდელი,

   თითოეული ფერის მნიშვნელობა იწერება 0-დან 255-მდე.
   0 ნიშნავს ფერის არ არსებობას.
   255 ნიშნავს მაქსიმალურ ინტენსივობას.

   rgb(255, 0, 0) -> მხოლოდ წითელი
   rgb(0, 0, 0) -> შავი (არცერთი ფერი)
   rgb(255, 255, 255) -> თეთრი (ყველა ფერი მაქსიმუმზე)

   RGB შეიძლება გამოყენებულ იქნას CSS-ში:
   color
   background-color

HEX არის ფერის კოდი.

   მნიშვნელობები იწერება 00-დან FF-მდე.
   00 ნიშნავს მინიმუმს
   FF ნიშნავს მაქსიმუმს

   #FF0000 -> წითელი
   #00FF00 -> მწვანე
   #0000FF -> ლურჯი
   #FFFFFF -> თეთრი
   #000000 -> შავი

   HEX და RGB ერთი და იგივე ფერებს გამოხატავენ,
   უბრალოდ განსხვავებული ფორმატით.


rgb(255, 0, 0) -> წითელი 
rgb(0, 255, 0) -> მწვანე
rgb(0, 0, 255) -> ლურჯი 
rgb(255, 255, 255) -> თეთრი 
rgb(0, 0, 0) -> შავი 


#FF0000  წითელი 
#00FF00  მწვანე 
#0000FF   ლურჯი
#FFFFFF  თეთრი
#000000  შავი

rgb(255, 0, 0)  --> FF0000
<!--rgb(0, 128, 0)--> #008000
<!--rgb(0, 0, 0)  --> #000000
